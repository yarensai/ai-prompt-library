# .vale.ini
StylesPath = styles
MinAlertLevel = warning

# Automatically download the Google style guide package
Packages = Google

# Apply these rules only to Markdown files
[*.md]
# Use the built-in Vale rules (spelling) and Google rules (grammar/style)
BasedOnStyles = Vale, Google

# Ignore templating variables like {{VARIABLE}} to prevent false positives
TokenIgnores = ({{.*?}})

# Downgrade some strict Google rules to 'warning' so they don't block the PR
Google.Passive = warning
Google.We = warning
